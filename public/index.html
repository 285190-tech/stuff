<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox Casino — play money only</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#e8eaf6;--mut:#8b91b5;--acc:#ffc233;--ok:#3ddc97;--bad:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header,footer{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer{color:var(--mut);font-size:13px;justify-content:center}
h1{margin:0;font-size:20px}.tag{color:var(--acc);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
main{max-width:960px;margin:0 auto;padding:0 16px 24px;display:grid;gap:16px}
.card{background:var(--card);border-radius:14px;padding:16px}
#bal{font-size:28px;color:var(--acc);font-weight:700}
#lobby{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
button,input,select{font:inherit;color:var(--ink);background:#262c4d;border:1px solid #333a66;border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#111}
#fields{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
#grid button{padding:6px 0}
#play{background:var(--acc);color:#111;font-weight:700;border:0}
#res{min-height:28px;margin-top:12px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
ol{margin:0;padding-left:22px}li{padding:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
#stage{min-height:170px;margin-top:12px;text-align:center}
.coin{width:90px;height:90px;border-radius:50%;background:#444;display:grid;place-items:center;font:700 36px system-ui;color:#111;margin:30px auto}
.spin{animation:sp .3s linear 3}@keyframes sp{to{transform:rotateY(360deg)}}
.bar{position:relative;height:36px;background:#262c4d;border-radius:8px;margin:60px 8px 0}
.zone{position:absolute;top:0;bottom:0;background:#3ddc9760;border-radius:8px}
.mark{position:absolute;top:-34px;left:0;transform:translateX(-50%);transition:left .8s;background:var(--acc);color:#111;padding:2px 8px;border-radius:6px;font-weight:700}
.big{font:700 56px system-ui;margin:40px 0 4px}
.svg{max-width:420px;width:100%}
#kg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:auto}
.kc{padding:6px 0;border-radius:6px;background:#262c4d;font-size:13px}.kc.pk{outline:2px solid var(--acc)}.kc.dr{background:#4a5190}.kc.hit{background:var(--ok);color:#111;font-weight:700}
.cards{display:flex;gap:16px;justify-content:center;margin-top:24px}
.card2{width:80px;height:110px;border-radius:10px;background:#f4f4f8;color:#111;display:grid;place-items:center;font:700 34px system-ui}
#stage{position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(#232a52,#141830);min-height:240px;padding:10px}
.win{animation:wn 1s}@keyframes wn{50%{box-shadow:0 0 50px 8px var(--ok) inset}}
.lose{animation:ls .5s}@keyframes ls{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.cf{position:absolute;top:-24px;font-size:22px;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translateY(300px) rotate(540deg);opacity:0}}
.flip{width:96px;height:96px;margin:50px auto 20px}.flip.t{animation:toss 1.4s ease-out}@keyframes toss{50%{transform:translateY(-90px) scale(1.35)}}
.coin3{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:700 40px system-ui;color:#111;background:radial-gradient(circle at 30% 30%,#ffe17a,#e0a100);box-shadow:0 6px 0 #a87400;transition:transform 1.4s cubic-bezier(.2,.8,.3,1)}
.kc.dr,.kc.hit{animation:pop .3s}@keyframes pop{50%{transform:scale(1.5)}}
.card2{transition:none}.back{background:repeating-linear-gradient(45deg,#3b4aa8,#3b4aa8 6px,#2b3787 6px,#2b3787 12px)!important;color:transparent!important}
.fl{animation:fl .5s}@keyframes fl{from{transform:rotateY(90deg)}}
.sm{width:58px;height:82px;font-size:22px}.cards{flex-wrap:wrap}
#mg{display:grid;grid-template-columns:repeat(5,64px);gap:6px;justify-content:center}#mg button{height:64px;font-size:26px;padding:0}
</style></head>
<body>
<header>
  <div><h1>🎰 Sandbox Casino</h1><div class="tag">Play money only · no real money, ever</div></div>
  <div class="row">
    <div>Balance <div id="bal">…</div></div>
    <div style="color:var(--mut)">Peak <b id="peak">…</b></div>
    <button id="daily">+250 daily</button><button id="reset">Reset to 1,000</button>
  </div>
</header>
<main>
  <div id="lobby" class="card"></div>
  <div class="card">
    <h2 id="title" style="margin:0"></h2>
    <div id="fields"></div>
    <div class="row"><label>bet<input id="bet" type="number" min="1" value="10"></label><button id="play">Play</button></div>
    <div id="stage"></div><div id="lv" class="row" style="margin-top:10px"></div><div id="res"></div>
  </div>
  <div class="card"><b>🏆 Top 20 peak balances</b><ol id="lb"></ol></div>
</main>
<footer>Play money only. Credits have no value and cannot be bought, sold or withdrawn.</footer>
<script>
const G={
  coinflip:['Coinflip',[['pick','heads','heads,tails']]],
  dice:['Dice',[['target',50],['side','under','under,over']]],
  limbo:['Limbo',[['target',2]]],
  plinko:['Plinko',[]],
  roulette:['Roulette',[['pick','red','red,black,odd,even,low,high'],['num','']]],
  wheel:['Wheel',[]],
  keno:['Keno (pick 1–5)',[]],
  hilo:['Hi-Lo',[['pick','hi','hi,lo']]],
  baccarat:['Baccarat',[['pick','player','player,banker,tie']]],
  crash:['Crash',[]],
  mines:['Mines',[['mines',3]]],
  blackjack:['Blackjack',[]]
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='coinflip',picks=new Set(),busy=false;

async function api(path,body){
  const r=await fetch('/api/'+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  return r.json();
}
function show(d){
  if(d.p){$('#bal').textContent=d.p.bal.toLocaleString();$('#peak').textContent=d.p.peak.toLocaleString();}
  if(d.lb)$('#lb').innerHTML=d.lb.map(x=>`<li>${esc(x.name)} — <b>${x.peak.toLocaleString()}</b></li>`).join('')||'<li>No runs yet — beat 1,000!</li>';
}
function panel(){
  $('#title').textContent=G[cur][0];
  $('#res').textContent='';$('#stage').innerHTML='';liveOn=false;runId++;$('#lv').innerHTML='';
  $('#fields').innerHTML=G[cur][1].map(([k,v,o])=>`<label>${k}${o
    ?`<select id="f_${k}">${o.split(',').map(x=>`<option>${x}</option>`).join('')}</select>`
    :`<input id="f_${k}" value="${v}" type="number" step="any">`}</label>`).join('')
    +(cur==='keno'?'<div id="grid">'+[...Array(40)].map((_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('')+'</div>':'');
  document.querySelectorAll('#lobby button').forEach(b=>b.classList.toggle('on',b.dataset.g===cur));
}
$('#lobby').innerHTML=Object.entries(G).map(([k,v])=>`<button data-g="${k}">${v[0].split(' ')[0]}</button>`).join('');
$('#lobby').onclick=e=>{const g=e.target.dataset.g;if(g){cur=g;picks.clear();panel();}};
$('#fields').onclick=e=>{
  const n=+e.target.dataset.n;if(!n)return;
  if(picks.has(n))picks.delete(n);else if(picks.size<5)picks.add(n);
  e.target.classList.toggle('on',picks.has(n));
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MULT=[5.6,2.1,1.1,1,0.5,1,1.1,2.1,5.6],WH=[0,1.5,0,2,0,1.5,0,3,0,1.9];
const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const rc=n=>n===0?'#2fb36b':RED.includes(n)?'#e5384f':'#222';
const cl=n=>({1:'A',11:'J',12:'Q',13:'K'}[n]||n);
const ORD=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26],SU=['♠','♥','♦','♣'];
function fx(win){
  const s=$('#stage');s.classList.remove('win','lose');void s.offsetWidth;s.classList.add(win?'win':'lose');
  if(win)for(let i=0;i<30;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🪙','✨','🎉'][i%3];e.style.left=Math.random()*95+'%';e.style.animationDelay=Math.random()*.5+'s';s.appendChild(e);}
}
async function anim(g,v,win){
  const s=$('#stage');
  if(g==='coinflip'){
    s.innerHTML='<div class="flip t"><div class="coin3" id="c3">?</div></div>';
    await sleep(30);$('#c3').style.transform='rotateX(1800deg)';await sleep(1500);
    const hd=v.o==='heads',c=$('#c3');c.textContent=hd?'H':'T';if(!hd)c.style.background='radial-gradient(circle at 30% 30%,#eef,#8d96c4)';
    s.insertAdjacentHTML('beforeend',`<div class="big" style="font-size:28px;margin:0">${hd?'HEADS':'TAILS'}</div>`);
  }
  if(g==='dice'){
    s.innerHTML=`<div class="big" id="dn">--</div><div class="bar" style="margin-top:30px"><div class="zone" style="left:${v.over?100-v.t:0}%;width:${v.t}%"></div><div class="mark" id="mk" style="top:-26px;background:none;padding:0;font-size:22px;color:var(--acc)">▼</div></div><div style="display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin:4px 8px"><span>0</span><span>50</span><span>100</span></div>`;
    for(let i=0;i<14;i++){$('#dn').textContent=(Math.random()*100).toFixed(2);await sleep(60);}
    $('#dn').textContent=v.roll.toFixed(2);$('#mk').style.left=v.roll+'%';await sleep(900);
  }
  if(g==='limbo'){
    const M=Math.max(v.crash,v.t)*1.1,Y=m=>160-140*Math.log(m)/Math.log(M),N=30;let pts='';
    s.innerHTML=`<svg viewBox="0 0 300 180" class="svg"><line x1="20" x2="290" y1="${Y(v.t)}" y2="${Y(v.t)}" stroke="#ffc233" stroke-dasharray="4"/><text x="24" y="${Y(v.t)-4}" font-size="10" fill="#ffc233">target ${v.t}×</text><polyline id="pl" fill="none" stroke="#3ddc97" stroke-width="3"/><text id="rk" font-size="20" x="10" y="160">🚀</text></svg><div class="big" id="lm" style="margin:0">1.00×</div>`;
    for(let i=0;i<=N;i++){const m=1+(v.crash-1)*i/N,x=20+260*i/N;pts+=`${x},${Y(m)} `;$('#pl').setAttribute('points',pts);$('#rk').setAttribute('x',x-8);$('#rk').setAttribute('y',Y(m));$('#lm').textContent=m.toFixed(2)+'×';await sleep(45);}
    $('#rk').textContent=win?'🏆':'💥';$('#lm').style.color=win?'var(--ok)':'var(--bad)';
  }
  if(g==='plinko'){
    const col=m=>m>=2?'#ff5c7a':m>=1.1?'#ffc233':m>=1?'#3ddc97':'#4a8cff';
    let h='<svg viewBox="0 0 300 200" class="svg">';
    for(let i=0;i<8;i++)for(let j=0;j<=i;j++)h+=`<circle id="pg${i}_${j}" cx="${150+30*(j-i/2)}" cy="${28+18*i}" r="2.5" fill="#8b91b5"/>`;
    MULT.forEach((m,k)=>h+=`<g id="sl${k}"><rect x="${150+30*(k-4)-13}" y="176" width="26" height="18" rx="4" fill="${col(m)}" opacity=".35"/><text x="${150+30*(k-4)}" y="189" text-anchor="middle" font-size="9" fill="#fff">${m}×</text></g>`);
    s.innerHTML=h+'<circle id="ball" r="5" fill="#ffc233" cx="150" cy="8" style="transition:transform .24s cubic-bezier(.4,0,.6,1.3)"/></svg>';
    const b=$('#ball');let j=0;
    for(let i=0;i<8;i++){
      b.style.transform=`translate(${30*(j-i/2)}px,${28+18*i-8-6}px)`;await sleep(250);
      const pg=$(`#pg${i}_${j}`);pg.setAttribute('fill','#ffc233');pg.setAttribute('r',5);setTimeout(()=>{pg.setAttribute('fill','#8b91b5');pg.setAttribute('r',2.5)},200);
      if(v.path[i]==='R')j++;
    }
    b.style.transform=`translate(${30*(v.k-4)}px,${176}px)`;await sleep(300);
    $('#sl'+v.k+' rect').setAttribute('opacity','1');
  }
  if(g==='roulette'){
    const A=360/37,pt=(a,r)=>{const t=(a-90)*Math.PI/180;return[150+r*Math.cos(t),120+r*Math.sin(t)]};
    let h='<svg viewBox="0 0 300 240" class="svg"><g id="rw" style="transform-origin:150px 120px;transition:transform 3s cubic-bezier(.1,.6,.2,1)">';
    ORD.forEach((n,i)=>{const a=pt(i*A-A/2,100),b=pt(i*A+A/2,100),c=pt(i*A+A/2,62),d=pt(i*A-A/2,62);
      h+=`<path d="M${a}A100 100 0 0 1 ${b}L${c}A62 62 0 0 0 ${d}Z" fill="${rc(n)}" stroke="#0f1220" stroke-width=".6"/><text transform="rotate(${i*A} 150 120)" x="150" y="42" text-anchor="middle" font-size="8" fill="#fff">${n}</text>`;});
    h+='<circle cx="150" cy="120" r="56" fill="#1a1f36"/></g><g id="bg" style="transform-origin:150px 120px;transition:transform 3s cubic-bezier(.1,.6,.2,1)"><circle id="bl" cx="150" cy="14" r="5" fill="#fff" style="transition:cy 3s"/></g><path d="M144 0h12l-6 10z" fill="#ffc233"/></svg>';
    s.innerHTML=h+`<div class="big" id="rn" style="font-size:34px;margin:0"></div>`;
    await sleep(60);$('#rw').style.transform=`rotate(${1440-ORD.indexOf(v.n)*A}deg)`;$('#bg').style.transform='rotate(-1080deg)';$('#bl').style.cy='39px';
    await sleep(3200);const rn=$('#rn');rn.textContent=v.n;rn.style.cssText+=`display:inline-block;padding:0 20px;border-radius:12px;background:${rc(v.n)}`;
  }
  if(g==='wheel'){
    let h='<svg viewBox="0 0 300 210" class="svg"><g id="wg" style="transform-origin:150px 110px;transition:transform 2.2s cubic-bezier(.15,.7,.2,1)">';
    WH.forEach((m,i)=>{const pt=(a,r)=>[150+r*Math.cos(a*Math.PI/180),110+r*Math.sin(a*Math.PI/180)],a0=i*36-90,[x1,y1]=pt(a0,90),[x2,y2]=pt(a0+36,90),[tx,ty]=pt(a0+18,62);
      h+=`<path d="M150 110L${x1} ${y1}A90 90 0 0 1 ${x2} ${y2}Z" fill="${m?(i%4===1?'#3ddc97':'#4a8cff'):'#333a66'}" stroke="#0f1220"/><text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${m}×</text>`;});
    s.innerHTML=h+'</g><circle cx="150" cy="110" r="10" fill="#0f1220"/><path d="M142 4h16l-8 18z" fill="#ffc233"/></svg>';
    await sleep(60);$('#wg').style.transform=`rotate(${1800-(v.i*36+18)}deg)`;await sleep(2400);
  }
  if(g==='keno'){
    s.innerHTML='<div id="kg">'+[...Array(40)].map((_,i)=>`<span id="k${i+1}" class="kc ${v.pk.includes(i+1)?'pk':''}">${i+1}</span>`).join('')+'</div><div class="big" id="kh" style="font-size:26px;margin:12px 0 0">0 hits</div>';
    let hh=0;
    for(const n of v.draw){await sleep(170);const hit=v.pk.includes(n);$('#k'+n).classList.add(hit?'hit':'dr');if(hit)$('#kh').textContent=++hh+' hits';}
  }
  if(g==='baccarat'){
    const tt=h=>h.reduce((a,x)=>a+(x>=10?0:x),0)%10,cd=n=>`<div class="card2 sm" style="color:#111">${cl(n)}</div>`;
    s.innerHTML='<div style="display:flex;justify-content:space-around;margin-top:16px"><div>Player <b id="bpt">0</b><div class="cards" id="bP" style="margin-top:8px"></div></div><div>Banker <b id="bbt">0</b><div class="cards" id="bB" style="margin-top:8px"></div></div></div>';
    const hp=[],hb=[],seq=[['P',v.P[0]],['B',v.B[0]],['P',v.P[1]],['B',v.B[1]],['P',v.P[2]],['B',v.B[2]]].filter(x=>x[1]);
    for(const[w,n]of seq){await sleep(600);(w==='P'?hp:hb).push(n);$('#b'+w).insertAdjacentHTML('beforeend',cd(n));$('#bpt').textContent=tt(hp);$('#bbt').textContent=tt(hb);}
  }
  if(g==='hilo'){
    const card=(n,id,back)=>`<div class="card2 ${back?'back':''}" id="${id}" style="color:${[1,2].includes((n*7)%4)?'#d22':'#111'}">${cl(n)}${SU[(n*7)%4]}</div>`;
    s.innerHTML=`<div class="cards" style="margin-top:36px">${card(v.a,'c1')}<div style="align-self:center;font-size:28px">→</div>${card(v.b,'c2',1)}</div>`;
    await sleep(900);const c=$('#c2');c.classList.remove('back');c.classList.add('fl');await sleep(600);
  }
}
let liveOn=false,runId=0;
const gapi=(game,act,x={})=>api('game',{game,act,...x});
const lv=h=>{$('#lv').innerHTML=h};
function endLive(win,msg){liveOn=false;lv('');const r=$('#res');r.className=win?'ok':'bad';r.textContent=msg;fx(win);api('state').then(show)}
const cH=n=>`<div class="card2 sm" style="color:${[1,2].includes(n/13|0)?'#d22':'#111'}">${cl(n%13+1)}${SU[n/13|0]}</div>`;
async function startLive(){
  const res=$('#res');res.textContent='';
  const d=await gapi(cur,cur==='blackjack'?'deal':'start',{bet:+$('#bet').value,n:$('#f_mines')?+$('#f_mines').value:0});
  if(d.error){res.className='bad';res.textContent=d.error;return}
  show(d);
  if(cur==='crash')runCrash();else if(cur==='mines')runMines();else{liveOn=true;bj(d)}
}
async function runCrash(){
  const id=++runId;liveOn=true;
  $('#stage').innerHTML='<div class="big" id="cm" style="margin-top:80px">1.00×</div>';
  lv('<button id="co" style="width:100%;font-size:20px">Cash out</button>');
  const fin=d=>{if(id!==runId)return;const c=$('#cm');
    if(d.error||d.crashed){c.textContent='💥 '+(d.point?d.point.toFixed(2)+'×':'');c.style.color='var(--bad)';endLive(false,d.error||`Crashed at ${d.point.toFixed(2)}×`)}
    else{c.style.color='var(--ok)';c.textContent=d.m.toFixed(2)+'×';endLive(true,`Cashed out at ${d.m.toFixed(2)}× — paid ${d.pay}`)}};
  $('#co').onclick=async()=>{if(!liveOn)return;liveOn=false;const d=await gapi('crash','cash');show(d);fin(d)};
  while(liveOn&&id===runId){
    const d=await gapi('crash','poll');if(!liveOn||id!==runId)break;
    if(d.crashed||d.error){liveOn=false;show(d);fin(d);break}
    $('#cm').textContent=d.m.toFixed(2)+'×';await sleep(150);
  }
}
function runMines(){
  liveOn=true;let lock=false;
  $('#stage').innerHTML='<div id="mg">'+[...Array(25)].map((_,i)=>`<button data-i="${i}"></button>`).join('')+'</div><div class="big" id="mm" style="font-size:24px;margin:10px 0 0">1.00×</div>';
  lv('<button id="co" disabled style="width:100%;font-size:18px">Cash out</button>');
  const rev=(ms,hit)=>ms.forEach(i=>{const b=$(`#mg [data-i="${i}"]`);b.textContent='💣';b.disabled=true;if(i===hit)b.style.background='var(--bad)'});
  $('#mg').onclick=async e=>{
    const i=e.target.dataset.i;if(i==null||lock||!liveOn||e.target.disabled)return;
    lock=true;const d=await gapi('mines','pick',{i});lock=false;
    if(d.error){endLive(false,d.error);return}show(d);
    if(d.boom){rev(d.mines,+i);endLive(false,'Boom! Stake lost')}
    else{e.target.textContent='💎';e.target.disabled=true;$('#mm').textContent=d.m.toFixed(2)+'×';
      if(d.won){rev(d.mines);endLive(true,`Cleared the board — paid ${d.pay}`)}else $('#co').disabled=false}
  };
  $('#co').onclick=async()=>{
    if(lock||!liveOn)return;lock=true;const d=await gapi('mines','cash');lock=false;
    if(d.error){endLive(false,d.error);return}show(d);rev(d.mines);endLive(true,`Cashed out at ${d.m.toFixed(2)}× — paid ${d.pay}`);
  };
}
function bj(d){
  $('#stage').innerHTML=`<div style="margin-top:8px">Dealer ${d.done?d.dt:'?'}</div><div class="cards" style="margin:6px 0 14px">${d.dh.map(cH).join('')}${d.done?'':'<div class="card2 sm back"></div>'}</div><div>You ${d.pt}</div><div class="cards" style="margin:6px 0">${d.ph.map(cH).join('')}</div>`;
  if(d.done){const L={blackjack:'Blackjack!',win:'You win',push:'Push',lose:'Dealer wins',bust:'Bust'};endLive(d.pay>d.bet,`${L[d.res]} — ${d.pay>0?'paid '+d.pay:'lost'}`);return}
  lv('<button id="bh">Hit</button><button id="bs">Stand</button>');
  const act=a=>async()=>{if(!liveOn)return;liveOn=false;const x=await gapi('blackjack',a);liveOn=true;if(x.error){endLive(false,x.error);return}show(x);bj(x)};
  $('#bh').onclick=act('hit');$('#bs').onclick=act('stand');
}
$('#play').onclick=async()=>{
  if(busy||liveOn)return;if({crash:1,mines:1,blackjack:1}[cur])return startLive();busy=true;
  const params={picks:[...picks]};
  G[cur][1].forEach(([k])=>params[k]=$('#f_'+k).value);
  const d=await api('play',{game:cur,bet:+$('#bet').value,params});
  const res=$('#res');
  if(d.error){busy=false;res.className='bad';res.textContent=d.error;return;}
  res.textContent='';await anim(cur,d.v,d.win);fx(d.win);busy=false;
  res.className=d.win?'ok':'bad';
  res.textContent=`${d.o} — ${d.pay>0?'paid '+d.pay:'lost'} (${d.m}×)`;
  show(await api('state'));
};
$('#daily').onclick=async()=>{const d=await api('state',{action:'daily'});if(d.error)alert(d.error);show(d);};
$('#reset').onclick=async()=>{if(confirm('Reset balance to 1,000?'))show(await api('state',{action:'reset'}));};
panel();api('state').then(show);
</script>
</body></html>
